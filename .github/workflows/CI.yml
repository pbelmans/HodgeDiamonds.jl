name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # so codecov can authenticate the upload without a token
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "lts", "1"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - run: julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2"))'
      - run: |
          julia -e '
            using JuliaFormatter
            format(["src", "test", "docs/make.jl"]) || begin
              write(stdout, read(`git diff`, String))
              error("some files are not formatted, run JuliaFormatter locally")
            end'
